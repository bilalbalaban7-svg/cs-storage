<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CS Storage Locator</title>
<style>
  :root{
    --pmi-blue:#0f2a5e;
    --pmi-blue2:#1c3c7a;
    --pmi-accent:#00a3e0;
    --pmi-gold:#c8a24b;
    --bg:#0b1830;
    --panel:#11233f;
    --panel2:#152a4d;
    --line:#22406e;
    --txt:#eaf1fb;
    --txt-dim:#9db3d6;
    --ok:#27c08a;
    --warn:#e0533d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #16335f 0%, transparent 60%),
      linear-gradient(160deg,#0b1830 0%,#0a1428 100%);
    color:var(--txt);
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  header{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;margin-bottom:18px;
    background:linear-gradient(135deg,var(--pmi-blue) 0%,var(--pmi-blue2) 100%);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .logo{
    width:42px;height:42px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,#fff 0%,#dfe7f5 100%);
    display:flex;align-items:center;justify-content:center;
    color:var(--pmi-blue);font-weight:800;font-size:18px;letter-spacing:-1px;
  }
  header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  header .sub{font-size:12px;color:#bcd0f0;font-weight:400;margin-top:2px}
  .gold-bar{height:3px;background:linear-gradient(90deg,var(--pmi-gold),transparent);border-radius:3px;margin-top:6px;width:90px}

  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{
    flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--txt-dim);font-size:14px;font-weight:600;
    cursor:pointer;text-align:center;transition:.15s;
  }
  .tab.active{background:var(--panel2);color:#fff;border-color:var(--pmi-accent);box-shadow:0 0 0 1px var(--pmi-accent) inset}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:16px;
  }
  .card h2{font-size:14px;color:var(--txt-dim);font-weight:600;margin-bottom:12px;text-transform:uppercase;letter-spacing:.6px}

  .searchrow{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{
    flex:1;min-width:200px;padding:14px 14px;font-size:16px;
    background:#0c1b34;border:1px solid var(--line);border-radius:10px;color:#fff;
  }
  input[type=text]:focus{outline:none;border-color:var(--pmi-accent)}
  .btn{
    padding:14px 22px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,var(--pmi-accent),#0079c2);color:#fff;
    transition:.15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}

  .result{display:none;margin-top:14px}
  .result.show{display:block}
  .result .loc-big{
    font-size:30px;font-weight:800;color:#fff;letter-spacing:.5px;
  }
  .result .meta{color:var(--txt-dim);font-size:13px;margin-top:4px}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-right:8px}
  .pill.blue{background:rgba(0,163,224,.15);color:#7fd3f5;border:1px solid #1f6f99}
  .pill.gold{background:rgba(200,162,75,.15);color:var(--pmi-gold);border:1px solid #6e5a24}
  .notfound{color:var(--warn);font-weight:600}

  /* QR scan */
  #reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:60px}
  .scan-status{font-size:13px;color:var(--txt-dim);margin-top:10px}

  /* 3D shelves */
  .scene-wrap{
    perspective:1400px;
    overflow-x:hidden;
    padding:24px 10px 20px;
    background:linear-gradient(180deg,#0a1730,#0c1d3a);
    border-radius:12px;border:1px solid var(--line);
  }
  .scene{
    transform-style:preserve-3d;
    transform:rotateX(12deg) rotateY(-18deg);
    transition:transform .4s;
    display:flex;flex-direction:column;gap:34px;align-items:center;
    margin:0 auto;
  }
  .rowgroup{display:flex;flex-direction:column;align-items:center;gap:8px}
  .rowgroup .rg-label{font-size:11px;letter-spacing:1px;color:var(--txt-dim);text-transform:uppercase;margin-bottom:4px}
  .rack-line{display:flex;gap:10px;transform-style:preserve-3d}
  .rack{
    transform-style:preserve-3d;
    display:flex;flex-direction:column-reverse;
    width:34px;
    border:1px solid #2c4a7d;border-radius:4px;
    background:linear-gradient(180deg,#15294a,#0f1f3a);
    box-shadow:2px 4px 14px rgba(0,0,0,.4);
  }
  .rack .rk-name{
    text-align:center;font-size:11px;font-weight:700;color:#9db3d6;
    padding:3px 0;background:#0c1b34;border-bottom:1px solid #2c4a7d;
  }
  .lvl{
    height:18px;border-top:1px solid #243f6b;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;color:#5e7aa8;position:relative;
  }
  .lvl.hit{
    background:var(--pmi-accent);
    color:#001;font-weight:800;
    animation:blink 1s ease-in-out infinite;
    box-shadow:0 0 14px 3px var(--pmi-accent);
    z-index:2;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .rack.hot{border-color:var(--pmi-accent);box-shadow:0 0 0 2px var(--pmi-accent),2px 4px 18px rgba(0,163,224,.5)}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--txt-dim)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* update panel */
  textarea{
    width:100%;min-height:160px;padding:12px;font-family:monospace;font-size:12px;
    background:#0c1b34;border:1px solid var(--line);border-radius:10px;color:#cfe0fb;
  }
  .hint{font-size:12px;color:var(--txt-dim);line-height:1.5;margin-top:8px}
  .stat{font-size:12px;color:var(--txt-dim);margin-top:6px}
  .hidden{display:none}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--txt-dim);font-weight:600}
  .small{font-size:12px;color:var(--txt-dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">CS</div>
    <div>
      <h1>CS Storage Locator</h1>
      <div class="sub">Warehouse shelf navigation system</div>
      <div class="gold-bar"></div>
    </div>
  </header>

  <!-- FIND -->
  <section id="tab-find" class="card">
    <h2>Find a CS</h2>
    <div class="searchrow">
      <input type="text" id="csInput" placeholder="Enter CS No (e.g. CS-7724-01)" autocomplete="off">
      <button class="btn" id="findBtn">Find</button>
    </div>
    <div class="result" id="result"></div>

    <div id="sceneArea" style="margin-top:18px;display:none">
      <div class="scene-wrap">
        <div class="scene" id="scene"></div>
      </div>
      <div class="legend">
        <span><i style="background:#15294a;border:1px solid #2c4a7d"></i>Shelf level</span>
        <span><i style="background:var(--pmi-accent)"></i>Target location (blinking)</span>
        <span class="small">View: Left (A–I) · Middle (J–R) · Right (S–Z) — 7 levels top→bottom.</span>
      </div>
    </div>
  </section>
</div>

<!-- XLSX parser -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
// ---------- data layer ----------
// Source of truth: depo_listesi.xlsx hosted next to this file.
// On load we fetch+parse it. Embedded CS_DATA is the offline fallback.
const XLSX_FILE='depo_listesi.xlsx';   // must sit beside this HTML on the host
const SHEET_NAME='Sayfa1';             // change here if your sheet is renamed
let LIVE_DATA=CS_DATA.slice();         // in-memory working copy

async function loadFromXlsx(){
  // cache-buster so a fresh GitHub commit shows up almost immediately
  const url=XLSX_FILE+'?t='+Date.now();
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const buf=await res.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[SHEET_NAME]||wb.Sheets[wb.SheetNames[0]];
  if(!ws) throw new Error('no sheet');
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  const out=[];
  for(const r of rows){
    const cs=String(r['CS No']??'').trim();
    const loc=String(r['Lokasyon']??'').trim().toUpperCase();
    const row=String(r['Row']??'').trim();
    if(cs&&loc&&row) out.push({cs,loc,row});
  }
  if(!out.length) throw new Error('no valid rows');
  return out;
}

function getData(){return LIVE_DATA;}

// ---------- shelf layout ----------
const LAYOUT={
  Left:  ['A','B','C','D','E','F','G','H','I'],
  Middle:['J','K','L','M','N','O','P','Q','R'],
  Right: ['S','T','U','V','W','X','Y','Z']
};
const LEVELS=7; // 1=top ... 7=bottom

// ---------- find ----------
const csInput=document.getElementById('csInput');
const findBtn=document.getElementById('findBtn');
const resultEl=document.getElementById('result');
const sceneArea=document.getElementById('sceneArea');
const sceneEl=document.getElementById('scene');

function normalize(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}

function find(){
  const q=normalize(csInput.value);
  if(!q){resultEl.className='result';return;}
  const data=getData();
  const hit=data.find(r=>normalize(r.cs)===q);
  if(!hit){
    resultEl.className='result show';
    resultEl.innerHTML='<div class="notfound">Not found: '+escapeHtml(csInput.value)+'</div><div class="meta">Check the CS number or update the data.</div>';
    sceneArea.style.display='none';
    return;
  }
  const letter=hit.loc[0];
  const level=parseInt(hit.loc.slice(1),10);
  const rowGroup=hit.row;
  resultEl.className='result show';
  resultEl.innerHTML=
    '<div class="loc-big">'+escapeHtml(hit.loc)+'</div>'+
    '<div class="meta" style="margin-top:8px">'+
      '<span class="pill blue">'+escapeHtml(rowGroup)+' side</span>'+
      '<span class="pill gold">Rack '+escapeHtml(letter)+'</span>'+
      '<span class="pill gold">Level '+(isNaN(level)?'?':level)+' / '+LEVELS+'</span>'+
    '</div>'+
    '<div class="meta" style="margin-top:6px">'+escapeHtml(hit.cs)+' &middot; Level 1 = top, '+LEVELS+' = bottom</div>';
  buildScene(rowGroup,letter,level);
  sceneArea.style.display='block';
}

findBtn.onclick=find;
csInput.addEventListener('keydown',e=>{if(e.key==='Enter')find();});

function buildScene(hitRow,hitLetter,hitLevel){
  sceneEl.innerHTML='';
  for(const [group,letters] of Object.entries(LAYOUT)){
    const rg=document.createElement('div');rg.className='rowgroup';
    const lab=document.createElement('div');lab.className='rg-label';lab.textContent=group+' ('+letters[0]+'–'+letters[letters.length-1]+')';
    rg.appendChild(lab);
    const line=document.createElement('div');line.className='rack-line';
    letters.forEach(L=>{
      const rack=document.createElement('div');rack.className='rack';
      const isHotRack=(group===hitRow && L===hitLetter);
      if(isHotRack)rack.classList.add('hot');
      const name=document.createElement('div');name.className='rk-name';name.textContent=L;
      rack.appendChild(name);
      // levels: build top(1) -> bottom(7); column-reverse renders bottom first, so append 7..1
      for(let lv=LEVELS;lv>=1;lv--){
        const cell=document.createElement('div');cell.className='lvl';
        cell.textContent=lv;
        if(isHotRack && lv===hitLevel){cell.classList.add('hit');cell.textContent=L+lv;}
        rack.appendChild(cell);
      }
      line.appendChild(rack);
    });
    rg.appendChild(line);
    sceneEl.appendChild(rg);
  }
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ---------- data source (xlsx) ----------
async function refreshData(){
  try{
    LIVE_DATA=await loadFromXlsx();
    if(csInput.value.trim()) find();
    return true;
  }catch(e){
    LIVE_DATA=CS_DATA.slice();
    return false;
  }
}

// ---------- boot: load data from xlsx, then handle ?cs= ----------
(async function(){
  await refreshData();
  const cs=new URLSearchParams(location.search).get('cs');
  if(cs){csInput.value=cs;find();}
})();
</script>
